# gentlemans-clock's game.conf (hornet-web kitten/deploy/game.conf.example has every key). deploy/deploy.sh is
# kitten's shim. This repo doesn't vendor kitten, so point at it:
#
#   GAME_DEPLOY=~/Documents/Sterling-Documents-Sync/hornet-web/kitten/deploy/game-deploy.sh deploy/deploy.sh plan
#
# The page: sterlinghirsh.com/gentlemans-clock/ on the cPanel host (static: index.html, css, js, fonts).
# The server: server/main.js bundled to server/main.cjs, socket.io on wss://gentlemans-clock.<RT_DOMAIN>/ws on
# realtime-1, port 7101 (sterlinghirsh.com deploy/rt/ports). Games live in memory, snapshotted to
# $DATA_DIR/games.json; a game idle for a day expires.

GAME=gentlemans-clock
TEST='npm test'
LOCAL_STAGE_DIR=.tmp/deploy

STATIC_TARGET=cpanel
CPANEL_DIR=gentlemans-clock
BASE_PATH=/gentlemans-clock/
CPANEL_EXT='html js css txt svg png eot ttf woff otf htaccess'
STATIC_DIR=dist
# The socket server's origin is baked into index.html (window.GC_SERVER).
CLIENT_BUILD='REALTIME_ORIGIN="$REALTIME_ORIGIN" BUILD_ID="$BUILD_ID" npm run build'
HEADERS=plain
# The 2013 assets aren't content-hashed; index.html busts the js and css cache with ?v=<build>.
HASHED_DIR=

# --- the server: gentlemans-clock.<RT_DOMAIN> on realtime-1
PORT=7101
RUNTIME=node
NODE_MAJOR=24
# One file with socket.io inside (esbuild); the droplet never runs npm install.
SERVER_BUILD='node scripts/bundle-server.mjs --out "$OUT"'
# It reads PORT, HOST, DATA_DIR, ALLOWED_ORIGINS and BUILD_ID from the unit's environment.
START='$NODE --enable-source-maps server/main.cjs'
VALIDATE=server/main.cjs
HEALTH=/health
HEALTH_MATCH=build
# socket.io runs at /ws (no trailing slash): polling and the WebSocket upgrade both use it.
WS_PATHS=/ws
ORIGIN_CHECK=server

# A few hundred clocks at most; tens of MB.
MEMORY_MAX=192M
TASKS_MAX=64
CPU_WEIGHT=100
NOFILE=4096
RESTART=always
